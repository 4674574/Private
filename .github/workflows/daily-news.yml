name: 每日新闻推送

# ============================================================
#  每天早上 8:00（北京时间）自动抓取新闻并发送到邮箱
#  也可以手动点按钮立即运行（第一次测试用这个）
# ============================================================

on:
  schedule:
    # GitHub 用的是 UTC 时间，北京时间 07:00 = UTC 23:30
    - cron: '30 23 * * *'
  # 允许手动点击运行
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    # 抓取失败时自动重试，避免偶发网络问题导致漏发
    timeout-minutes: 15

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 抓取新闻并发送邮件
        env:
          # 下面这些值来自你设置的 Secrets，不会公开显示
          MAIL_SENDER: ${{ secrets.MAIL_SENDER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_RECIPIENTS: ${{ secrets.MAIL_RECIPIENTS }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          USE_SSL: ${{ secrets.USE_SSL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_MODEL: ${{ secrets.AI_MODEL }}



        run: python run_ci.py

      - name: 保存新闻存档
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-archive
          path: data/
          retention-days: 7
          if-no-files-found: ignore
